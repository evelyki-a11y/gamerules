spring.application.name=gamerules

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.google.genai.chat.temperature=0.2
spring.ai.google.genai.chat.top-p=0.9
spring.ai.google.genai.chat.max-output-tokens=2000
spring.ai.google.genai.chat.thinking-level=HIGH